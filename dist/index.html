<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://use.typekit.net/ess7xmw.css" />

    <!-- Material Design CDN CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css"
    />

    <!-- Material Design CDN JS -->
    <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>

    <!-- Material Design Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />

    <!-- Favicon -->
    <link rel="icon" href="./images/favicon.ico" />
    <link rel="icon" href="./images/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./images/apple-touch-icon.png" />

    <!-- User Style/JavaScript -->
    <script src="./index.js" defer></script>
    <link rel="stylesheet" href="index.css" />

    <title>Milestones</title>
  </head>

  <body>
    <div id="flex-wrapper">
      <div class="flex-item">

        <h1 class="heading">
          Willkommen in unserem virtuellen Max-Planck-Institut!
        </h1>

        <hr style="width: 100%; text-align: left; margin-left: 0" />
        
        <br />
        
        <div id="video-img-wrapper">
          <img
            id="video-img-item"
            src="./images/mpi-entrance.gif"
            alt="Eingang des Max-Planck-Instituts"
          />
        </div>

        <div id="button-center-wrapper">
          <button
            type="button"
            class="ccp-button confirm mdc-button mdc-button--raised"
            id="button-center-item"
          >
            <div class="mdc-button__ripple"></div>
            <span class="mdc-button__label">
              <strong>TRETEN SIE EIN</strong>
            </span>
          </button>
        </div>

        <br />

        <hr style="width: 100%; text-align: left; margin-left: 0" />

        <br />

        <div class="columns">
          <div class="col">
            <img id="logo-ccp" src="./images/mpi-eva-ccp.svg" />
          </div>

          <div class="col">
            <img id="logo-leuphana" src="./images/leuphana.svg" />
          </div>
        </div>

        <br />

        <a href="https://www.eva.mpg.de/de/impressum/" target="_blank">
          Impressum
        </a>

      </div>
    </div>
  </body>
</html>
