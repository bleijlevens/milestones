<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.ico" />
    <script src="./task.js" defer></script>
    <link rel="stylesheet" href="task.css" />
    <title>Milestones</title>
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="https://use.typekit.net/ess7xmw.css" />

    <!-- Material Design CDN CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css"
    />

    <!-- Material Design CDN JS -->
    <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>

    <!-- Material Design Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <!-- Typography -->
    <link rel="stylesheet" href="https://use.typekit.net/ess7xmw.css" />

    <!-- Favicon -->
    <link rel="icon" href="./images/favicon.ico" />
    <link rel="icon" href="./images/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./images/apple-touch-icon.png" />
    <link rel="manifest" href="app.webmanifest" />
  </head>

  <body>
    <div id="flex-wrapper">
      <div id="flex-item">
        <br />

        <div id="viewport">

          <div class="stack-wrapper">
            <div class="swipe-side swipe-side-left"></div>
            <ul id="stack"></ul>
            <div class="swipe-side swipe-side-right"></div>
          </div>

          <div class="response-buttons">
            <div id="button-no" class="response-button">
              <img id="cross" alt="cross" src="images/cross.svg" />
              <h3>nein</h3>
            </div>

            <div id="button-yes" class="response-button">
              <img id="check" alt="check" src="images/check.svg" />
              <h3>ja</h3>
            </div>
          </div>

          <button class="back-button" id="button-back" disabled>
            <h3>← zurück</h3>
          </button>

        </div>

        <h3 id="counter"></h3>


        <!-- end flex-item -->
      </div>

      <!-- end flex-wrapper -->
    </div>
  </body>
</html>
