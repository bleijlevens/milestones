<!DOCTYPE html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://use.typekit.net/ess7xmw.css" />
    <!-- Material Design CDN CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css"
    />

    <!-- Material Design CDN JS -->
    <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>

    <!-- Material Design Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <!-- Typography -->
    <link rel="stylesheet" href="https://use.typekit.net/ess7xmw.css" />

    <!-- Favicon -->
    <link rel="icon" href="./images/favicon.ico" />
    <link rel="icon" href="./images/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./images/apple-touch-icon.png" />

    <!-- <link rel="manifest" href="app.webmanifest" /> -->

    <!-- User Style/JavaScript -->
    <script src="./welcome.js" defer></script>
    <link rel="stylesheet" href="index.css" />
    <link rel="icon" href="./favicon.ico" />
    <title>Milestones</title>
  </head>
  <body>
    <div id="flex-wrapper">
      <div class="flex-item">
      
        <h1 class="heading">Wir begrüßen Sie ganz herzlich!</h1>

        <hr style="width: 100%; text-align: left; margin-left: 0" />
        <br />

        <p>
          Wenn Sie möchten, können Sie sich ein kurzes Willkommensvideo von
          unserer Studienleiter*innen anschauen. Klicken Sie dazu auf das
          <strong>Play</strong>-Zeichen auf dem Video. 
        </p>

        <div id="video-img-wrapper">
          <video id="video-img-item" controls>
            <source src="videos/milestones_welcome_video.mp4" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
        </div>

        <p>
          <strong>
            Um fortzufahren, klicken Sie bitte auf den
            WEITER-Knopf.
          </strong>
        </p>

        <div id="button-center-wrapper">
          <button
            type="button"
            class="ccp-button confirm mdc-button mdc-button--raised"
            id="button-center-item"
          >
            <div class="mdc-button__ripple"></div>
            <span class="mdc-button__label"
              ><strong>WEITER</strong></span
            >
          </button>
        </div>

        <br />
        <hr style="width: 100%; text-align: left; margin-left: 0" />
        <br />

        <div class="columns">
          <div class="col">
            <img id="logo-ccp" src="./images/mpi-eva-ccp.svg" />
          </div>
          <div class="col">
            <img id="logo-leuphana" src="./images/leuphana.svg" />
          </div>
        </div>

        <br />

        <a href="https://www.eva.mpg.de/de/impressum/" target="_blank"
          >Impressum</a
        >

        <!-- end flex-item -->
      </div>

      <!-- end flex-wrapper -->
    </div>
  </body>
</html>
